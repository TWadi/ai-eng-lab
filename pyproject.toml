[project]
name = "ai-engineering-arena"
license = "Apache-2.0"
version = "0.1.0"
description = "Shared workspace for learning AI engineering"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "requests>=2.32",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
    "nbstripout>=0.7",
]
# Install per phase with: uv sync --group <name>
ml = ["scikit-learn>=1.5", "seaborn>=0.13"]
dl = ["torch>=2.4"]
llm = ["anthropic>=0.40", "sentence-transformers>=3.0", "psycopg[binary]>=3.2", "pgvector>=0.3"]
agents = ["mcp>=1.0", "claude-agent-sdk>=0.1"]
prod = ["fastapi>=0.115", "uvicorn>=0.30", "langfuse>=2.0"]

[tool.uv]
default-groups = ["dev"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shared"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
extend-exclude = ["*.ipynb"]
