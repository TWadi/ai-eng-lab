name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run pytest
      - name: Validate coding challenges (reference solutions pass, starters fail)
        run: uv run python site/challenges/build.py && git diff --exit-code site/src/swc/logic/lab/challenges.gen.json site/public/harness.py

  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - name: Architecture rules (layers, no cycles, Supabase only in bsw/)
        run: npm run lint:arch
      - run: npm test
      - run: npm run build

  database:
    # Replays every migration on a fresh PostgreSQL (with a Supabase shim) and runs the SQL tests.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - name: Migrations + SQL tests
        run: bash supabase/tests/run.sh
        env:
          PSQL: psql -h localhost -U postgres
          PGPASSWORD: postgres
